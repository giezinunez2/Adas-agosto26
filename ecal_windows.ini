; ============================================================================
; eCAL 5.12 — configuración del clúster ADAS para el HMI NATIVO de Windows
;
; Este archivo NO sustituye a ecal.ini:
;   * Las Raspberry Pi (ADASCore, zorros-desk) y el HMI en Linux siguen usando
;     ecal.ini montado en /app/ecal.ini y /etc/ecal/ecal.ini.
;   * En Windows, utils/helper_functions.py::prepare_ecal_config() copia este
;     archivo a %LOCALAPPDATA%\ADAS\ecal\ecal.ini y exporta ECAL_DATA antes de
;     inicializar eCAL. Es la única forma de que eCAL 5.12 use una configuración
;     propia sin permisos de administrador:
;         %ECAL_DATA%\ecal.ini   ->   %ProgramData%\eCAL\ecal.ini
;
; - Descubrimiento: multicast UDP 239.0.0.1:14000 (misma subred que las Pi).
; - Payload (video / metadatos): TCP (use_tcp = 1). SHM y UDP multicast se
;   apagan para publicar porque los nodos están en hosts distintos.
; - El firewall de Windows debe permitir UDP 14000 y TCP 14000
;   (iniciar_windows.ps1 revisa y crea esas reglas).
; - npcap_enabled se deja en false: solo hace falta si se quiere multicast vía
;   Npcap en adaptadores que no lo soportan de forma nativa.
; ============================================================================

[network]
network_enabled = true
multicast_config_version  = v1
multicast_group           = 239.0.0.1
multicast_mask            = 0.0.0.15
multicast_port            = 14000
multicast_ttl             = 2
multicast_sndbuf          = 5242880
multicast_rcvbuf          = 5242880
multicast_join_all_if     = true
bandwidth_max_udp         = -1

inproc_rec_enabled        = true
shm_rec_enabled           = true
tcp_rec_enabled           = true
udp_mc_rec_enabled        = true
npcap_enabled             = false

tcp_pubsub_num_executor_reader = 4
tcp_pubsub_num_executor_writer = 4
tcp_pubsub_max_reconnections   = 5

host_group_name           =

[common]
registration_timeout      = 60000
registration_refresh      = 1000

[time]
timesync_module_rt        = "ecaltime-localtime"

[process]
terminal_emulator         =

; --------------------------------------------------
; Capas de transporte del PUBLISHER (0 = off, 1 = on, 2 = auto)
; --------------------------------------------------
[publisher]
use_inproc                = 0
use_shm                   = 0
use_tcp                   = 1
use_udp_mc                = 0

memfile_minsize           = 4096
memfile_reserve           = 50
memfile_ack_timeout       = 0
memfile_buffer_count      = 1
memfile_zero_copy         = 0

share_ttype               = 1
share_tdesc               = 1

[monitoring]
timeout                   = 5000
filter_excl               = __.*
filter_incl               =
filter_log_con            = error, fatal, warning
filter_log_file           =
filter_log_udp            = info, warning, error, fatal

[sys]
filter_excl               = ^eCALSysClient$|^eCALSysGUI$|^eCALSys$

[experimental]
shm_monitoring_enabled      = false
shm_monitoring_domain       = ecal_mon
shm_monitoring_queue_size   = 1024
network_monitoring_disabled = false
drop_out_of_order_messages  = false
